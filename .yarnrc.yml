nodeLinker: node-modules

# Pin the package manager to a binary committed in this repo, so `yarn` resolves
# to Yarn 4.18.0 no matter which yarn is on PATH. Every yarn honours yarnPath,
# including the Yarn 1.22.x that GitHub runners preinstall — measured: classic
# reports 1.22.22 without this line and 4.18.0 with it. That is what makes
# `yarn install --immutable` in release.yml actually immutable; before this,
# classic Yarn serviced it, could not read a Yarn 4 lockfile, silently ignored
# --immutable (it spells it --frozen-lockfile) and rewrote the lockfile on every
# release run.
#
# Deliberately NOT relying on Corepack: Node stopped distributing it as of
# 25.0.0 (nodejs/node doc/contributing/distribution.md) and Node 26 becomes
# Active LTS on 2026-10-28, so anything reaching for `corepack` behind
# node-version 'lts/*' breaks that day. yarnPath has no Node-version coupling.
# packageManager in package.json is kept in sync for developers who do use
# Corepack locally.
yarnPath: .yarn/releases/yarn-4.18.0.cjs

# Supply-chain minimum release age: refuse to RESOLVE any dependency version
# published less than 3 days ago (smash-and-grab malware is usually yanked
# within hours). Matches the gate in convertcom/javascript-sdk.
#
# Note what this does and does not cover. The gate is enforced at resolution, so
# it guards `yarn add` / `yarn up` — the moment a new version enters the
# lockfile. It is not consulted by a frozen install: `yarn install --immutable`
# against a committed lockfile passes regardless, and a Dependabot PR arrives
# with the resolved lockfile already written. So this protects the act of
# choosing a version, not CI.
#
# No npmPreapprovedPackages entry: this project has no internal npm
# dependencies (the PHP packages ship via Packagist), so nothing in our own
# release chain can stall on a freshly-published package.
npmMinimalAgeGate: 4320
